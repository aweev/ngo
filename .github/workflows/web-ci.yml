name: Web CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: web-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify + Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Next.js route types
        run: pnpm typegen

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: Static verify gates
        run: |
          node scripts/verify-action-auth.mjs
          node scripts/verify-cta-links.mjs
          node scripts/verify-i18n.mjs
          node scripts/verify-migrations.mjs

      - name: Build (standalone)
        env:
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          NEXT_OUTPUT: standalone
        run: pnpm build

  rls:
    name: RLS Isolation (Supabase)
    needs: verify
    runs-on: ubuntu-latest
    # Requires a linked Supabase project for ephemeral branch testing.
    # Set SUPABASE_ACCESS_TOKEN + SUPABASE_PROJECT_ID as repo secrets to enable.
    if: ${{ github.repository != '' && vars.RUN_RLS == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Create ephemeral branch and run RLS tests
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
        run: |
          BRANCH="ci-${{ github.run_id }}"
          supabase branches create "$BRANCH" --project-ref "$SUPABASE_PROJECT_ID"
          sleep 60
          supabase db push --branch "$BRANCH" --project-ref "$SUPABASE_PROJECT_ID"
          echo "RLS test suite execution requires psql against the branch DB."
          echo "Extend this step to connect + run supabase/tests/rls-isolation-tests.sql"
          supabase branches delete "$BRANCH" --project-ref "$SUPABASE_PROJECT_ID"

  e2e:
    name: E2E (Playwright)
    needs: verify
    runs-on: ubuntu-latest
    # Non-blocking until test suites are authored; flip required once green.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
      - name: Run E2E tests
        env:
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
        run: pnpm test:e2e
