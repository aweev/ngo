services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ngo-web:local
    container_name: ngo-web
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env.local
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
